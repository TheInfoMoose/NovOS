# ==============================================================================
# NovOS Custom Tools & Ultrawide Component Manifest
# ==============================================================================
# Consumed by `/usr/local/bin/novos-custom-tools` during image build or post-boot
# provisioning. Supports `local`, `github_release`, `github_source`, and `tarball` types.

schema_version: 1

tools:
  - name: novos-custom-tools
    enabled: true
    type: local
    description: "NovOS Declarative Custom Tools & GitHub Component Builder"
    source_path: "target/release/novos-custom-tools"
    build_command: "cargo build --release -p novos-custom-tools"
    fallback_repo: "https://github.com/theinfomoose/NovOS.git"
    fallback_branch: "main"
    install_target: "/usr/local/bin/novos-custom-tools"
    symlinks:
      - "/usr/local/bin/novos-ct"

  - name: cosmic-comp-ultrawide-patch
    enabled: false
    type: github_source
    description: "Template entry for pulling and building custom-patched pop-os/cosmic-comp or user ultrawide fork"
    repo: "https://github.com/pop-os/cosmic-comp.git"
    branch: "master"
    build_system: "cargo"
    build_command: "cargo build --release"
    artifact_path: "target/release/cosmic-comp"
    install_target: "/usr/local/bin/cosmic-comp"

  - name: cosmic-ext-tweaks-release
    enabled: false
    type: github_release
    description: "Example GitHub Release workflow supporting .deb, .AppImage, .tar.gz, or raw binary assets"
    repo: "cosmic-utils/tweaks"
    tag: "latest"
    asset_format: "tar.gz"
    asset_pattern: ".*x86_64.*\\.tar\\.gz$"
    install_target: "/usr/local/bin/cosmic-ext-tweaks"

  - name: uv-ruff-github-source
    enabled: false
    type: github_source
    description: "Example GitHub Source workflow built via cargo / uv tool install / make"
    repo: "https://github.com/astral-sh/ruff.git"
    branch: "main"
    build_system: "uv"
    build_command: "uv tool install ."
    install_target: "/usr/local/bin/ruff"

  - name: zig
    enabled: false # installed by the dev profile via `--tool zig`, not by `--install-enabled`
    type: tarball
    description: "Zig compiler, official ziglang.org x86_64-linux tarball pinned by sha256"
    version: "0.17.1"
    url: "https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz"
    sha256: "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"
    install_dir: "/opt/zig"
    binary: "zig"
    install_target: "/usr/local/bin/zig"
