# ==============================================================================
# NovOS Calamares Users Module Configuration
# ==============================================================================
---
defaultGroups:
    - sudo
    - adm
    - video
    - render
    - input
    - audio
    - plugdev
    - netdev
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: true
doReusePassword: true
defaultShell: /bin/bash
