# ==============================================================================
# NovOS Calamares Modular Profile & Granular Package Selection (netinstall.yaml)
# Maps top-level profiles to /usr/local/bin/novos-setup and provides expandable
# subgroups for individual package customization during installation.
# ==============================================================================
---
- name: "Wireless & WiFi Connectivity Stack"
  description: "Intel, Realtek, Atheros, MediaTek, and Broadcom wireless firmware with iwd and wpa_supplicant daemons. Deselect on wired-only desktops to purge WiFi daemons and firmware."
  selected: true
  critical: false
  expanded: false
  subgroups:
    - name: "Wireless Daemons & Regulatory Tools"
      description: "iwd, wpasupplicant, wireless-regdb, iw, and rfkill wireless management utilities."
      selected: true
      packages:
        - novos-profile-wifi
        - iwd
        - wpasupplicant
        - wireless-regdb
        - iw
        - rfkill
    - name: "Wireless Network Firmware"
      description: "WiFi firmware for Intel (iwlwifi), Realtek, Qualcomm Atheros, MediaTek, and Broadcom chipsets."
      selected: true
      packages:
        - novos-profile-wifi
        - firmware-iwlwifi
        - firmware-realtek
        - firmware-atheros
        - firmware-mediatek
        - firmware-brcm80211

- name: "Bluetooth Audio & Peripherals Stack"
  description: "BlueZ protocol stack, OBEX file transfer, Blueman desktop manager, and PipeWire Bluetooth audio (LDAC/aptX/AAC). Deselect to purge Bluetooth packages and mask bluetooth.service."
  selected: true
