# ==============================================================================
# NovOS Calamares Post-Install Shellprocess Configuration
# ==============================================================================
---
dontChroot: false
timeout: 3600
script:
    - command: "/usr/local/bin/novos-setup --post-calamares --user @@USER@@"
      timeout: 3600
    - command: "rm -f /usr/sbin/policy-rc.d"
    - command: printf '[terminal]\nvt = 7\n\n[default_session]\ncommand = "/usr/local/bin/cosmic-greeter-launch"\nuser = "cosmic-greeter"\n' > /etc/greetd/config.toml
    - "chown -R cosmic-greeter:cosmic-greeter /var/lib/cosmic-greeter /var/cache/tuigreet 2>/dev/null || true"
    - command: "rm -f /etc/sudoers.d/99-novos-live /etc/polkit-1/rules.d/49-novos-live-calamares.rules /usr/share/applications/install-novos.desktop /home/@@USER@@/Desktop/install-novos.desktop /home/@@USER@@/Desktop/calamares.desktop /home/*/Desktop/install-novos.desktop /home/*/Desktop/calamares.desktop /etc/skel/Desktop/install-novos.desktop /etc/skel/Desktop/calamares.desktop"
    - command: "if [ -n \"@@USER@@\" ] && [ \"@@USER@@\" != \"devuser\" ] && id -u \"@@USER@@\" >/dev/null 2>&1; then userdel -r -f devuser 2>/dev/null || true; groupdel devuser 2>/dev/null || true; rm -rf /home/devuser /var/spool/mail/devuser /var/lib/AccountsService/users/devuser /var/lib/AccountsService/icons/devuser; chown -R \"@@USER@@:@@USER@@\" /srv/llm /srv/devshare 2>/dev/null || true; fi"
    - command: "rm -rf /lib/live /usr/lib/live /usr/share/initramfs-tools/hooks/live* /usr/share/initramfs-tools/scripts/live* /etc/initramfs-tools/conf.d/novos-live.conf /etc/systemd/system/live-config.service /lib/systemd/system/live-config.service"
