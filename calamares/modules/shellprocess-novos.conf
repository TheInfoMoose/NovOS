# ==============================================================================
# NovOS Calamares Post-Install Shellprocess Configuration
# ==============================================================================
---
dontChroot: false
timeout: 3600
script:
    - command: "/usr/local/bin/novos-setup --post-calamares --user @@USER@@"
      timeout: 3600
    - command: "rm -f /usr/sbin/policy-rc.d"
    - command: "printf '[terminal]\\nvt = 7\\n\\n[default_session]\\ncommand = \"/usr/local/bin/cosmic-greeter-launch\"\\nuser = \"_greetd\"\\n' > /etc/greetd/config.toml"
    - command: "rm -f /etc/sudoers.d/99-novos-live /home/@@USER@@/Desktop/install-novos.desktop /home/@@USER@@/Desktop/calamares.desktop /home/*/Desktop/install-novos.desktop /home/*/Desktop/calamares.desktop /etc/skel/Desktop/install-novos.desktop /etc/skel/Desktop/calamares.desktop"
    - command: "rm -rf /lib/live /usr/lib/live /usr/share/initramfs-tools/hooks/live* /usr/share/initramfs-tools/scripts/live* /etc/initramfs-tools/conf.d/novos-live.conf /etc/systemd/system/live-config.service /lib/systemd/system/live-config.service"
