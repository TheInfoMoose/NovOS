# ==============================================================================
# NovOS Calamares Pre-Packages APT Cache Refresh Configuration
# ==============================================================================
---
dontChroot: false
timeout: 600
script:
    - command: "if [ ! -c /dev/null ]; then rm -f /dev/null && mknod -m 666 /dev/null c 1 3; fi; mountpoint -q /dev/pts || mount -t devpts devpts /dev/pts -o gid=5,mode=620; mkdir -p /usr/sbin; printf '#!/bin/sh\\nexit 101\\n' > /usr/sbin/policy-rc.d && chmod 0755 /usr/sbin/policy-rc.d; if [ ! -s /etc/resolv.conf ] || ! grep -qE '^[[:space:]]*nameserver[[:space:]]+' /etc/resolv.conf 2>/dev/null; then rm -f /etc/resolv.conf; if [ -s /run/systemd/resolve/resolv.conf ]; then cp -fL /run/systemd/resolve/resolv.conf /etc/resolv.conf; else echo 'nameserver 1.1.1.1' > /etc/resolv.conf; echo 'nameserver 8.8.8.8' >> /etc/resolv.conf; fi; fi; apt-get update -q || true"
      timeout: 600
