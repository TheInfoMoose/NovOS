# ==============================================================================
# NovOS Calamares Pre-Packages APT Cache Refresh Configuration
# ==============================================================================
---
dontChroot: false
timeout: 600
script:
    - command: "mkdir -p /dev /dev/pts /dev/shm /run/udev /usr/sbin /etc/apt/apt.conf.d; chmod 1777 /dev/shm; [ -c /dev/null ] || { rm -f /dev/null; mknod -m 666 /dev/null c 1 3; }; [ -c /dev/zero ] || { rm -f /dev/zero; mknod -m 666 /dev/zero c 1 5; }; [ -c /dev/full ] || { rm -f /dev/full; mknod -m 666 /dev/full c 1 7; }; [ -c /dev/random ] || { rm -f /dev/random; mknod -m 666 /dev/random c 1 8; }; [ -c /dev/urandom ] || { rm -f /dev/urandom; mknod -m 666 /dev/urandom c 1 9; }; [ -c /dev/tty ] || { rm -f /dev/tty; mknod -m 666 /dev/tty c 5 0; }; chmod 0666 /dev/null /dev/zero /dev/full /dev/random /dev/urandom /dev/tty 2>/dev/null || true"
      timeout: 120
    - command: "/usr/local/bin/novos-setup --pre-packages"
      timeout: 600
