# ==============================================================================
# NovOS Calamares Partition & Anti-Bloat Btrfs Subvolume Mount Config
# ==============================================================================
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      fs: bind
      mountPoint: /dev
      options: [ bind ]
    - device: /dev/pts
      fs: bind
      mountPoint: /dev/pts
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
      options: [ defaults, noatime, mode=755 ]
    - device: /run/udev
      fs: bind
      mountPoint: /run/udev
      options: [ bind ]
    - device: /sys/firmware/efi/efivars
      fs: bind
      mountPoint: /sys/firmware/efi/efivars
      options: [ bind ]
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log
    - mountPoint: /var/cache
      subvolume: /@var_cache
    - mountPoint: /var/lib/docker
      subvolume: /@docker
    - mountPoint: /var/lib/containerd
      subvolume: /@containerd
    - mountPoint: /var/lib/flatpak
      subvolume: /@flatpak
    - mountPoint: /srv/llm
      subvolume: /@llm
    - mountPoint: /srv/devshare
      subvolume: /@devshare

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:3, commit=60, space_cache=v2 ]
