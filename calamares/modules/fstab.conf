# ==============================================================================
# NovOS Calamares Fstab Module Configuration
# ==============================================================================
---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime,compress=zstd:3,commit=60,space_cache=v2
    vfat: defaults,umask=0077

ssdExtraMountOptions:
    btrfs: discard=async

crypttabOptions: luks

tmpOptions:
    default:
        tmpfs: false
    ssd:
        tmpfs: false
