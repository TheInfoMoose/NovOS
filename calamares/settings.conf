# ==============================================================================
# NovOS Calamares Installer Master Settings
# ==============================================================================
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:       prepackages
    module:   shellprocess
    config:   shellprocess-prepackages.conf
  - id:       novos
    module:   shellprocess
    config:   shellprocess-novos.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - netinstall
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - shellprocess@prepackages
      - packages
      - shellprocess@novos
      - limine-bootloader
      - umount
  - show:
      - finished

branding: novos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
