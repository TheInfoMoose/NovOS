# ==============================================================================
# NovOS Unified Package Manifest (config/packages.yaml)
# Single source of truth. Removing or disabling an entry requires explicit user approval (guard-diff).
#
# Migrated losslessly in STEP 9A from:
#   scripts/stages/03-core-system.sh   -> layer: base
#   scripts/stages/04-cosmic-desktop.sh -> layer: desktop (cargo/rustc build fallback -> base)
#   calamares/modules/netinstall.yaml   -> layer: profile (group/subgroup names, descriptions, flags verbatim)
#   scripts/stages/05-profiles-installer.sh install_*_profile (safe_apt_install) and
#   configure_*_flathub (flatpak install) -> layer: profile
# Entry fields: name, source (apt|flatpak|novos-meta), arch (amd64|i386|all), required,
# alternative (name|null), smoke (null until a smoke check is defined).
# ==============================================================================
